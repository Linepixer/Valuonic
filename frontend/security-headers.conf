# Included from every server/location that sets its own add_header, since nginx drops inherited
# headers as soon as a block declares one. __API_ORIGIN__ is filled from VITE_API_URL at image build.

# Browsers ignore HSTS on plain HTTP, so this is a no-op locally and only takes effect behind the TLS proxy.
add_header Strict-Transport-Security "max-age=31536000" always;

# Google Identity Services sources follow Google's documented CSP for the GIS client.
# The style-src hash allows the inline <style id="googleidentityservice_button_styles"> the GIS client injects on load.
# We render our own Google button, so if Google changes that CSS the only effect is a console warning, which prints
# the new hash to put here ("Applying inline style violates ... a hash ('sha256-...')"). Last updated 2026-11-20.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'sha256-88QphsXJQwxKP9xXR175ZSMzpaq6Swzj9u3QQ+G2Wig=' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cryptologos.cc https://www.svgrepo.com; connect-src 'self' __API_ORIGIN__ https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
