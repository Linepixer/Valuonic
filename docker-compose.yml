services:
  db:
    image: postgres:15-alpine
    container_name: valuonic-db
    env_file:
      - .env
    # Not published on the host: the API reaches it over the compose network, and a host port would clash
    # with any Postgres already installed on the machine. Use `docker compose exec db psql` to inspect it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: valuonic-api
    env_file:
      - .env
    environment:
      # Override to use docker internal network
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Demo transactions for `python -m app.seed_demo`.
      - ./samples:/app/samples:ro
    depends_on:
      # The API runs migrations on start, so it must wait until Postgres accepts connections.
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # API URL accessible from the client's browser
        - VITE_API_URL=http://localhost:8000
        # Same Client ID as the API, so a single .env configures Google login.
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: valuonic-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
