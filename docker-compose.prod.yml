services:
  db:
    image: postgres:15-alpine
    container_name: valuonic-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/linepixer/valuonic-api:latest
    container_name: valuonic-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: ghcr.io/linepixer/valuonic-web:latest
    container_name: valuonic-web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 valuonic-api valuonic-web
    environment:
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped

volumes:
  postgres_data:
